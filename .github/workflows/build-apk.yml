name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -q CleanTok.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APKs
        working-directory: CleanTok
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Collect APKs
        run: |
          mkdir -p dist
          cp CleanTok/app/build/outputs/apk/webview/debug/app-webview-debug.apk dist/CleanTok-webview.apk
          cp CleanTok/app/build/outputs/apk/gecko/debug/app-gecko-debug.apk dist/CleanTok-gecko.apk
      - uses: actions/upload-artifact@v4
        with:
          name: CleanTok-apk
          path: dist/*.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: CleanTok build ${{ github.run_number }}
          files: dist/*.apk
